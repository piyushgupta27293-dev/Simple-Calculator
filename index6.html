<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="../CSS/style6.css">
    <link rel = "icon" href = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdWtAWTfgWYUOjb7Wr9keCNT3NICXnxTxj5bskuV1XrQ&s=10">
</head>
<body>
     <main>
      <h1>Simple Calculator</h1>
    <div class="calculator">
    
            <input type="text" placeholder="0" id="inputBox" disabled><br>
            <div>
               <button class = "m">MU</button>
               <button class = "m">MRC</button>
                <button class = "m">M-</button>
               <button class = "m">M+</button>
            </div>
            <div>
               <button class = "operator" del>DEL</button>
               <button class = "operator" ac>AC</button>
               <button class = "operator" %>%</button>
               <button class = "operator" />/</button>
               
            </div>
            <div>
               <button class = "btn">7</button>
               <button class = "btn">8</button>
               <button class = "btn">9</button>
               <button class = "operator" *>*</button>
               
            </div>
            <div>
               <button class = "btn">4</button>
               <button class = "btn">5</button>
               <button class = "btn">6</button>
               <button class = "operator" ->-</button>
            </div>
            <div>
               <button class = "btn">1</button>
               <button class = "btn">2</button>
               <button class = "btn">3</button>
               <button class = "operator" +>+</button>
            </div>
            <div>
               <button class = "btn">00</button>
               <button class = "btn">0</button>
               <button class = "btn">.</button>
               <button class = "equal-btn" =>=</button>
            </div>
            </div>
        </form>
       

        </main>
        <script src="../JAVA SCRIPT/app6.js"></script>
</body>
</html>
